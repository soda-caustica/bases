{% extends 'base.html' %}

{% block title %}Iniciar Sesión{% endblock %}

{% block header %}
  <h1>Accede a tu cuenta</h1>
  <p class="subtitle">Ingresa tu RUT y contraseña para continuar</p>
{% endblock %}

{% block content %}
  <form method="post" class="login-form">
    <div class="form-group">
      <label for="rut">RUT</label>
      <input type="text" name="rut" id="rut" required placeholder="12.345.678-9">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" name="password" id="password" required placeholder="Tu contraseña">
    </div>

    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
  </form>
{% endblock %}
